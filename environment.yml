name: langchain
channels:
  - conda-forge
  - defaults

# ================================ 注意 ================================
# 本文件里的所有版本都是"钉死"的，请勿升级。
# 不要点击 PyCharm / conda 的"有新版本"提示——PyCharm 只对比 PyPI 上有没有
# 更新的版本，并不知道包之间的依赖约束。
#
# 为什么升级会出问题：conda 和 pip 混用，pip 段在最后执行，会按 PyPI 的依赖
# 关系重新求解。例如把 pydantic 升到 2.14，pip 会因为 openrouter 要求
# pydantic<2.13 而把它降回 2.12.5，最终环境与文件不一致。
#
# 需要改版本时：先改这个文件 -> 运行 make update（或 make restart）->
# 用 `conda list -n langchain` 和 `python -c "import xxx"` 验证后再提交。
# =====================================================================

dependencies:
  # conda 能装的都写在这里
  - python=3.12.9
  - langchain=1.4.6
  - langgraph=1.2.16
  - langsmith=0.14.11
  - langchain-text-splitters=1.1.3
  - langchain-deepseek=1.1.1
  - rich=15.0.0
  # 不能升到 2.13+：pip 段的 openrouter 要求 pydantic<2.13
  # noinspection OutdatedRequirement
  - pydantic=2.12.5
  - requests=2.34.2
  - ruff=0.17.1
  - python-dotenv=1.2.4
  - pip
  - pip:
      # conda-forge 上没有的包才走 pip，版本照样钉死
      # langchain-openrouter 目前未发布到 conda-forge（2026-10-18 查证）
      - langchain-openrouter==0.2.9
      # openrouter 是 langchain-openrouter 的依赖，显式钉住：
      # 0.11.x 把 pydantic 卡在 <2.13，不钉的话以后自动升级可能改变这条约束
      - openrouter==0.11.46
